<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e2942"/>
    </pattern>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f43f5e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#070a10"/>
  <rect width="1200" height="720" fill="url(#dots)"/>

  <text x="24" y="34" fill="#6b7280" font-size="12" letter-spacing="2">SEED LAB · SQL INJECTION · PHP / MYSQL · DOCKER</text>

  <!-- ============ shared payload ============ -->
  <g>
    <rect x="420" y="58" width="360" height="56" rx="8" fill="#11192e" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="600" y="80" text-anchor="middle" fill="#6b7280" font-size="11" letter-spacing="1">ATTACKER INPUT · username</text>
    <text x="600" y="102" text-anchor="middle" fill="#f3f4f6" font-size="17" font-weight="700">admin' #</text>
  </g>
  <path d="M 470,114 L 300,114 L 300,142" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRed)"/>
  <path d="M 730,114 L 900,114 L 900,142" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- ============ LEFT: vulnerable ============ -->
  <g>
    <rect x="40" y="150" width="540" height="270" rx="10" fill="#0d1321" stroke="#f43f5e" stroke-width="1.6"/>
    <rect x="40" y="150" width="540" height="34" rx="10" fill="#11192e"/>
    <rect x="40" y="174" width="540" height="10" fill="#11192e"/>
    <circle cx="62" cy="167" r="5" fill="#f43f5e"/>
    <text x="76" y="171" fill="#f3f4f6" font-size="13" font-weight="700">VULNERABLE</text>
    <text x="560" y="171" text-anchor="end" fill="#6b7280" font-size="11">unsafe_home.php</text>

    <text x="62" y="214" fill="#6b7280" font-size="12">// string concatenation</text>
    <text x="62" y="240" fill="#9ca3af" font-size="13">SELECT id, name, salary, ssn</text>
    <text x="62" y="260" fill="#9ca3af" font-size="13">FROM credential</text>
    <text x="62" y="280" font-size="13"><tspan fill="#9ca3af">WHERE name='</tspan><tspan fill="#f43f5e" font-weight="700">admin'</tspan><tspan fill="#f43f5e" font-weight="700"> #</tspan></text>
    <text x="62" y="300" fill="#4b5563" font-size="13" text-decoration="line-through">  and Password='$hashed_pwd'</text>
    <text x="300" y="300" fill="#f43f5e" font-size="11">&#8592; commented out</text>

    <line x1="62" y1="328" x2="558" y2="328" stroke="#1e2942" stroke-width="1"/>
    <text x="62" y="354" fill="#f43f5e" font-size="13" font-weight="700">AUTH BYPASSED</text>
    <text x="62" y="376" fill="#9ca3af" font-size="12">logged in as admin, no password</text>
    <text x="62" y="396" fill="#9ca3af" font-size="12">full table leaked: names, salaries, SSNs</text>
  </g>

  <!-- ============ RIGHT: patched ============ -->
  <g>
    <rect x="620" y="150" width="540" height="270" rx="10" fill="#0d1321" stroke="#10b981" stroke-width="1.6"/>
    <rect x="620" y="150" width="540" height="34" rx="10" fill="#11192e"/>
    <rect x="620" y="174" width="540" height="10" fill="#11192e"/>
    <circle cx="642" cy="167" r="5" fill="#10b981"/>
    <text x="656" y="171" fill="#f3f4f6" font-size="13" font-weight="700">PATCHED</text>
    <text x="1140" y="171" text-anchor="end" fill="#6b7280" font-size="11">prepared statement</text>

    <text x="642" y="214" fill="#6b7280" font-size="12">// code and data kept separate</text>
    <text x="642" y="240" fill="#9ca3af" font-size="13">SELECT id, name, salary, ssn</text>
    <text x="642" y="260" fill="#9ca3af" font-size="13">FROM credential</text>
    <text x="642" y="280" font-size="13"><tspan fill="#9ca3af">WHERE name = </tspan><tspan fill="#00f0ff" font-weight="700">?</tspan><tspan fill="#9ca3af"> and Password = </tspan><tspan fill="#00f0ff" font-weight="700">?</tspan></text>
    <text x="642" y="300" font-size="13"><tspan fill="#9ca3af">bind_param("ss", </tspan><tspan fill="#f3f4f6">"admin' #"</tspan><tspan fill="#9ca3af">, ...)</tspan></text>

    <line x1="642" y1="328" x2="1138" y2="328" stroke="#1e2942" stroke-width="1"/>
    <text x="642" y="354" fill="#10b981" font-size="13" font-weight="700">INJECTION BLOCKED</text>
    <text x="642" y="376" fill="#9ca3af" font-size="12">payload bound as a literal string</text>
    <text x="642" y="396" fill="#9ca3af" font-size="12">0 rows returned, nothing leaked</text>
  </g>

  <!-- ============ attack chain strip ============ -->
  <g font-size="11">
    <text x="40" y="458" fill="#6b7280" letter-spacing="1">ATTACKS DEMONSTRATED</text>
    <g>
      <rect x="40" y="470" width="250" height="30" rx="6" fill="#11192e" stroke="#f43f5e" stroke-width="1"/>
      <text x="165" y="490" text-anchor="middle" fill="#f3f4f6">auth bypass</text>
      <rect x="302" y="470" width="250" height="30" rx="6" fill="#11192e" stroke="#f43f5e" stroke-width="1"/>
      <text x="427" y="490" text-anchor="middle" fill="#f3f4f6">UPDATE injection: salary edit</text>
      <rect x="564" y="470" width="250" height="30" rx="6" fill="#11192e" stroke="#f43f5e" stroke-width="1"/>
      <text x="689" y="490" text-anchor="middle" fill="#f3f4f6">account takeover via hash</text>
      <rect x="826" y="470" width="334" height="30" rx="6" fill="#11192e" stroke="#10b981" stroke-width="1"/>
      <text x="993" y="490" text-anchor="middle" fill="#f3f4f6">fix verified against same payloads</text>
    </g>
  </g>
</svg>
